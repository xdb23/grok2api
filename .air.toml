# Air: Go 热重载。改 backend 源码后自动编译重启，通常 1–5 秒。
# 文档: https://github.com/air-verse/air
#
# 用法:
#   make dev-api
#   # 或
#   cd /opt/g2a-xdb/grok2api && air -c .air.toml

root = "."
tmp_dir = "tmp"
# 不要监听整个 monorepo 前端
testdata_dir = "testdata"

[build]
  bin = "./tmp/grok2api-dev"
  cmd = "cd backend && GOCACHE=/opt/g2a-xdb/grok2api/.gocache go build -o ../tmp/grok2api-dev ./cmd/grok2api"
  delay = 400
  exclude_dir = ["tmp", "frontend", "data", "docs", "node_modules", ".git", ".gocache", "docker"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = ["backend"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false
  # 与现网端口一致；配置见 config.dev.yaml
  args_bin = ["--config", "config.dev.yaml", "--listen", "127.0.0.1:18000"]

[log]
  main_only = false
  time = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
